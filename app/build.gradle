plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'io.gitlab.arturbosch.detekt'
}

// 可选的本地配置（local.properties 在 .gitignore 中）：
//   SA_API_TOKEN=...      位置上报接口的鉴权 token（无后端可留空）
//   AMAP_API_KEY=...      备用：也可在此配置高德 Key（推荐直接改 AndroidManifest.xml）
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def apiToken = localProperties.getProperty("SA_API_TOKEN", "")


android {
    // debug 签名：使用本机默认 debug.keystore
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    namespace 'com.example.smartalbum'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.example.smartalbum"
        minSdk 27
        targetSdk 34
        versionCode 162
        versionName "5.13.93"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 后端地址占位：本开源版不内置服务器，如需位置上报/自动更新，请部署自己的后端
        // 并把下面两个 URL 改成你自己的域名；不需要这些功能可保持占位，APP 核心功能（地图浏览本地照片）不受影响。
        buildConfigField("String", "API_BASE_URL", "\"https://your-api.example.com\"")
        buildConfigField("String", "UPDATE_BASE_URL", "\"https://your-update.example.com\"")
        buildConfigField("String", "API_TOKEN", "\"$apiToken\"")
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // 复用与线上一致的 debug.keystore：智能相册历史版本(含 v5.13.35)均以此签名发布，
            // 换正式签名会导致已装用户 INSTALL_FAILED_UPDATE_INCOMPATIBLE 无法覆盖更新。
            // 与 AppUpdateManager 的“同签名校验”一致。
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        pickFirsts += ['assets/**']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.amap.api:map2d:6.0.0'
    implementation 'com.amap.api:search:9.7.0'
    implementation 'com.amap.api:location:6.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    // Android仪器测试
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'

    // Hilt依赖注入
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-compiler:2.48'
}


detekt {
    config = files("../detekt.yml")
    buildUponDefaultConfig = false
    allRules = false
    ignoreFailures = true
}
